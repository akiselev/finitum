[package]
name = "finitum"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Concrete discretization and global operator realization for the Sinbad stack."

[dependencies]
blake3 = "1"
cadabra-provider = { path = "../cadabra3/crates/cadabra-provider" }
malleus = { path = "../malleus" }
scientia = { path = "../scientia" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
methodus = { path = "../methodus" }
thiserror = "2"

[dev-dependencies]
quantitas = { path = "../quantitas" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
