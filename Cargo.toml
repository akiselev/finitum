[package]
name = "finitum"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Concrete discretization and global operator realization for the Sinbad stack."

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

